<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Syntax Drills</title>
    <script>
      /* Set the theme before first paint; same rules as resolveTheme in src/app/theme.ts. */
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('syntax-drills/theme');
        } catch (e) {}
        if (choice !== 'light' && choice !== 'dark')
          choice = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = choice;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
