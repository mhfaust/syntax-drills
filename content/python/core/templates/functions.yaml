# ---------------------------------------------------------------- def-return

- id: def-double
  skills: [def-return]
  prompt: 'Define a function `double(n)` that returns `n` times 2.'
  solution: |
    <<def>> double(n):
        <<return>> n * 2
  check:
    calls: ['double(3)', 'double(-4)', 'double(0)']

- id: def-area
  skills: [def-return]
  prompt: 'Define a function `area(width, height)` that returns the area of a rectangle.'
  solution: |
    def area(<<width, height>>):
        <<return>> width * height
  check:
    calls: ['area(3, 4)', 'area(2.5, 2)', 'area(0, 7)']

- id: def-full-name
  skills: [def-return]
  level: 2
  prompt: 'Define `full_name(first, last)` that returns the two names joined with a space.'
  solution: |
    <<def full_name(first, last)>>:
        return first + " " + last
  check:
